<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>vector-01</title>
  <style>
    body {
      margin: 0;
      background: #1e1e2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #cdd6f4;
      gap: 0.75rem;
    }
    .label { opacity: 0.5; font-size: 0.75rem; }
    button {
      background: none;
      border: 1px solid currentColor;
      color: #cdd6f4;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: monospace;
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0.4;
    }
    button:hover { opacity: 0.8; }
    img {
      display: block;
      width: 95vw;
      height: calc(100vh - 5rem);
      max-height: 95vh;
      object-fit: contain;
      outline: 1px solid rgba(128,128,128,0.4);
    }
  </style>
</head>
<body>
  <div style="display:flex; align-items:center; gap:0.5rem;">
    <span class="label">vector-01.svg</span>
    <button onclick="navigator.clipboard.writeText('/home/franssen/tikz-studio/out/vectors/vector-01.svg')">copy path</button>
  </div>
  <img src="vectors/vector-01.svg" />
</body>
</html>
